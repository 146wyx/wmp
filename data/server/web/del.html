<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歌曲管理 - 删除歌曲</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2rem;
            background: linear-gradient(90deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .header p {
            color: #888;
        }

        .toolbar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }

        .search-box input:focus {
            border-color: #667eea;
            background: rgba(255, 255, 255, 0.15);
        }

        .search-box input::placeholder {
            color: #666;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-danger {
            background: linear-gradient(90deg, #e74c3c, #c0392b);
            color: #fff;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4);
        }

        .btn-danger:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 15px 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-card .number {
            font-size: 1.8rem;
            font-weight: 700;
            color: #667eea;
        }

        .stat-card .label {
            color: #888;
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .song-list {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }

        .song-item {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            transition: background 0.3s;
        }

        .song-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .song-item:last-child {
            border-bottom: none;
        }

        .song-checkbox {
            margin-right: 15px;
        }

        .song-checkbox input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .song-info {
            flex: 1;
            min-width: 0;
        }

        .song-title {
            font-weight: 600;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-artist {
            color: #888;
            font-size: 0.9rem;
        }

        .song-meta {
            display: flex;
            gap: 15px;
            color: #666;
            font-size: 0.85rem;
            margin-top: 5px;
        }

        .song-actions {
            display: flex;
            gap: 10px;
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 0.85rem;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(0, 0, 0, 0.9);
            color: #fff;
            padding: 15px 30px;
            border-radius: 8px;
            font-weight: 500;
            opacity: 0;
            transition: all 0.3s;
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast.success {
            background: rgba(46, 204, 113, 0.9);
        }

        .toast.error {
            background: rgba(231, 76, 60, 0.9);
        }

        .select-all {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .select-all input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .select-all label {
            cursor: pointer;
            color: #888;
        }

        @media (max-width: 768px) {
            .toolbar {
                flex-direction: column;
            }

            .search-box {
                min-width: 100%;
            }

            .song-item {
                flex-wrap: wrap;
            }

            .song-actions {
                width: 100%;
                margin-top: 10px;
                justify-content: flex-end;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>歌曲管理</h1>
            <p>删除不需要的歌曲文件</p>
        </div>

        <div class="toolbar">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="搜索歌曲名称或艺术家...">
            </div>
            <button class="btn btn-danger" id="batchDeleteBtn" disabled>
                <span>批量删除</span>
                <span id="selectedCount"></span>
            </button>
            <button class="btn btn-secondary" id="refreshBtn">刷新列表</button>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="number" id="totalSongs">0</div>
                <div class="label">总歌曲数</div>
            </div>
            <div class="stat-card">
                <div class="number" id="selectedSongs">0</div>
                <div class="label">已选择</div>
            </div>
        </div>

        <div class="song-list" id="songList">
            <div class="loading">
                <div class="spinner"></div>
                <div>加载中...</div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let allSongs = [];
        let selectedSongs = new Set();

        // 加载歌曲列表
        async function loadSongs() {
            const songList = document.getElementById('songList');
            songList.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <div>加载中...</div>
                </div>
            `;

            try {
                const response = await fetch('/api/music-list');
                const result = await response.json();

                if (result.success) {
                    allSongs = result.data || [];
                    renderSongs(allSongs);
                    updateStats();
                } else {
                    showToast('加载失败: ' + result.error, 'error');
                }
            } catch (error) {
                showToast('加载失败: ' + error.message, 'error');
            }
        }

        // 渲染歌曲列表
        function renderSongs(songs) {
            const songList = document.getElementById('songList');

            if (songs.length === 0) {
                songList.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
                        </svg>
                        <div>暂无歌曲</div>
                    </div>
                `;
                return;
            }

            const html = `
                <div class="select-all">
                    <input type="checkbox" id="selectAllCheckbox">
                    <label for="selectAllCheckbox">全选</label>
                </div>
                ${songs.map(song => `
                    <div class="song-item" data-id="${song.id}">
                        <div class="song-checkbox">
                            <input type="checkbox" value="${song.id}" ${selectedSongs.has(song.id) ? 'checked' : ''}>
                        </div>
                        <div class="song-info">
                            <div class="song-title">${song.title || song.filename}</div>
                            <div class="song-artist">${song.artist || '未知艺术家'}</div>
                            <div class="song-meta">
                                <span>${formatDuration(song.duration)}</span>
                                <span>${formatSize(song.size)}</span>
                            </div>
                        </div>
                        <div class="song-actions">
                            <button class="btn btn-danger btn-small" onclick="deleteSong('${song.id}', '${song.filename}')">删除</button>
                        </div>
                    </div>
                `).join('')}
            `;

            songList.innerHTML = html;

            // 绑定复选框事件
            bindCheckboxEvents();
        }

        // 绑定复选框事件
        function bindCheckboxEvents() {
            // 单个复选框
            document.querySelectorAll('.song-checkbox input[type="checkbox"]').forEach(checkbox => {
                checkbox.addEventListener('change', function() {
                    const songId = this.value;
                    if (this.checked) {
                        selectedSongs.add(songId);
                    } else {
                        selectedSongs.delete(songId);
                    }
                    updateStats();
                    updateSelectAllCheckbox();
                });
            });

            // 全选复选框
            const selectAllCheckbox = document.getElementById('selectAllCheckbox');
            if (selectAllCheckbox) {
                selectAllCheckbox.addEventListener('change', function() {
                    const checkboxes = document.querySelectorAll('.song-checkbox input[type="checkbox"]');
                    checkboxes.forEach(checkbox => {
                        checkbox.checked = this.checked;
                        const songId = checkbox.value;
                        if (this.checked) {
                            selectedSongs.add(songId);
                        } else {
                            selectedSongs.delete(songId);
                        }
                    });
                    updateStats();
                });
            }
        }

        // 更新全选复选框状态
        function updateSelectAllCheckbox() {
            const selectAllCheckbox = document.getElementById('selectAllCheckbox');
            if (!selectAllCheckbox) return;

            const checkboxes = document.querySelectorAll('.song-checkbox input[type="checkbox"]');
            const checkedBoxes = document.querySelectorAll('.song-checkbox input[type="checkbox"]:checked');

            selectAllCheckbox.checked = checkboxes.length > 0 && checkboxes.length === checkedBoxes.length;
        }

        // 更新统计
        function updateStats() {
            document.getElementById('totalSongs').textContent = allSongs.length;
            document.getElementById('selectedSongs').textContent = selectedSongs.size;

            const batchDeleteBtn = document.getElementById('batchDeleteBtn');
            const selectedCount = document.getElementById('selectedCount');

            if (selectedSongs.size > 0) {
                batchDeleteBtn.disabled = false;
                selectedCount.textContent = `(${selectedSongs.size})`;
            } else {
                batchDeleteBtn.disabled = true;
                selectedCount.textContent = '';
            }
        }

        // 删除单个歌曲
        async function deleteSong(songId, filename) {
            if (!confirm(`确定要删除歌曲 "${filename}" 吗？\n\n此操作将同时删除音乐文件、歌词和封面（如果存在）。`)) {
                return;
            }

            await performDelete([songId]);
        }

        // 批量删除
        async function batchDelete() {
            if (selectedSongs.size === 0) return;

            if (!confirm(`确定要删除选中的 ${selectedSongs.size} 首歌曲吗？\n\n此操作将同时删除音乐文件、歌词和封面（如果存在）。`)) {
                return;
            }

            await performDelete(Array.from(selectedSongs));
        }

        // 执行删除
        async function performDelete(songIds) {
            try {
                const response = await fetch('/api/music/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ids: songIds })
                });

                const result = await response.json();

                if (result.success) {
                    showToast(`成功删除 ${songIds.length} 首歌曲`, 'success');
                    // 清除已选择
                    songIds.forEach(id => selectedSongs.delete(id));
                    // 重新加载
                    await loadSongs();
                } else {
                    showToast('删除失败: ' + result.error, 'error');
                }
            } catch (error) {
                showToast('删除失败: ' + error.message, 'error');
            }
        }

        // 搜索过滤
        function filterSongs(keyword) {
            if (!keyword) {
                renderSongs(allSongs);
                return;
            }

            const lowerKeyword = keyword.toLowerCase();
            const filtered = allSongs.filter(song => {
                const title = (song.title || song.filename || '').toLowerCase();
                const artist = (song.artist || '').toLowerCase();
                return title.includes(lowerKeyword) || artist.includes(lowerKeyword);
            });

            renderSongs(filtered);
        }

        // 格式化时长
        function formatDuration(seconds) {
            if (!seconds) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        // 格式化文件大小
        function formatSize(bytes) {
            if (!bytes) return '0 B';
            const units = ['B', 'KB', 'MB', 'GB'];
            let size = bytes;
            let unitIndex = 0;
            while (size >= 1024 && unitIndex < units.length - 1) {
                size /= 1024;
                unitIndex++;
            }
            return `${size.toFixed(1)} ${units[unitIndex]}`;
        }

        // 显示提示
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type} show`;

            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // 绑定事件
        document.getElementById('searchInput').addEventListener('input', function() {
            filterSongs(this.value);
        });

        document.getElementById('batchDeleteBtn').addEventListener('click', batchDelete);

        document.getElementById('refreshBtn').addEventListener('click', loadSongs);

        // 初始化
        loadSongs();
    </script>
</body>
</html>
